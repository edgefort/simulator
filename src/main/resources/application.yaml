server:
  port: ${SERVER_PORT:50001}

spring:
  application:
    name: simulator
  mvc:
    # PUT/PATCH/DELETE bodies are never form parameters here; parsing them would reject or corrupt binary uploads
    # such as PGP keys sent with a client's default form content type.
    formcontent:
      filter:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    display-request-duration: true

simulator:
  default-profile: happy-path
  admin-token: ${SIMULATOR_ADMIN_TOKEN:simulator}
  limits:
    max-transactions: 1000
    max-overrides: 100
    max-rules: 100
    max-held-requests: 20
    scheduler-threads: 2
    transaction-ttl: 15m
    override-ttl: 5m
    max-delay: 2m
  # Named behaviors. Select them per provider, per operation, per reference, or per request field value through
  # the admin API or the provider settings below. Provider requests never carry simulator parameters.
  profiles:
    happy-path:
      outcome: success
    failure:
      outcome: failure
    delayed-success:
      outcome: success
      delay: 3s
    pending:
      outcome: pending
      completes-as: success
      transition-delay: 5s
    pending-then-failed:
      outcome: pending
      completes-as: failed
      transition-delay: 5s
    pending-then-reversed:
      outcome: pending
      completes-as: reversed
      transition-delay: 5s
    pending-forever:
      outcome: pending
      completes-as: never
    # The client receives no response. Set delay above the client's read timeout.
    timeout:
      outcome: timeout
      delay: 60s
      completes-as: success
    timeout-then-failed:
      outcome: timeout
      delay: 60s
      completes-as: failed
    timeout-not-received:
      outcome: timeout
      delay: 60s
      received: false
  providers:
    nibss-nip:
      enabled: true
      specification-version: NIP v9.5 SOAP web service with SSM message security (messages 010-023)
      security-mode: ssm-pgp
      base-path: ${NIBSS_NIP_BASE_PATH:}
      config:
        # Base64 of an OpenPGP secret key ring (armored or binary). Empty: the built-in test key pair
        # (nibss-nip/simulator-test-secret-key.asc), identical on every start; never use it in production.
        simulator-private-key: ${NIBSS_NIP_SIMULATOR_PRIVATE_KEY:}
        simulator-private-key-passphrase: ${NIBSS_NIP_SIMULATOR_PRIVATE_KEY_PASSPHRASE:}
        # Base64 of the institution's OpenPGP public key ring. Empty: upload it through the admin API.
        client-public-key: ${NIBSS_NIP_CLIENT_PUBLIC_KEY:}
        inward:
          url: ${NIBSS_NIP_INWARD_URL:}
          namespace: ${NIBSS_NIP_INWARD_NAMESPACE:http://core.nip.nibss/}
          request-element: ${NIBSS_NIP_INWARD_REQUEST_ELEMENT:request}
          soap-action: ${NIBSS_NIP_INWARD_SOAP_ACTION:}
          timeout: ${NIBSS_NIP_INWARD_TIMEOUT:30s}
          source-institution-code: ${NIBSS_NIP_INWARD_SOURCE_INSTITUTION_CODE:999999}
    interswitch:
      enabled: true
      specification-version: Quickteller Service API v5 public documentation (Send Money, Bills Payment and Airtime)
      security-mode: oauth-client-credentials-and-bearer
      base-path: ${INTERSWITCH_BASE_PATH:}
      config:
        client-id: ${INTERSWITCH_CLIENT_ID:simulator-client}
        client-secret: ${INTERSWITCH_CLIENT_SECRET:simulator-secret}
        access-token: ${INTERSWITCH_ACCESS_TOKEN:simulator-access-token}
        token-expires-in: ${INTERSWITCH_TOKEN_EXPIRES_IN:86400}
        terminal-id: ${INTERSWITCH_TERMINAL_ID:3PBL0001}
    onafriq-bill-payment:
      enabled: true
      specification-version: Biller Aggregation Platform API v1.0.0 public documentation
      security-mode: api-key
      base-path: ${ONAFRIQ_BASE_PATH:}
      config:
        api-key: ${ONAFRIQ_API_KEY:simulator-api-key}
